
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAATATANN KAMEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f7f7;
    color: #222;
    padding: 25px 16px;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    margin-bottom: 30px;
}

header h1 {
    font-size: 25px;
    margin-bottom: 6px;
}

header p {
    color: #888;
    font-size: 14px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: white;
    color: #222;
    font-size: 14px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #888;
}

textarea {
    resize: vertical;
    min-height: 110px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 7px;
    background: #222;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #444;
}

.search {
    margin-top: 28px;
    margin-bottom: 20px;
}

.note {
    padding: 18px 0;
    border-bottom: 1px solid #e5e5e5;
}

.note h3 {
    font-size: 17px;
    margin-bottom: 8px;
}

.note p {
    color: #555;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.note small {
    display: block;
    margin-top: 12px;
    color: #999;
    font-size: 12px;
}

.delete {
    background: transparent;
    color: #d33;
    padding: 7px 0;
    margin-top: 7px;
}

.delete:hover {
    background: transparent;
    color: #900;
    text-decoration: underline;
}

.empty {
    text-align: center;
    color: #999;
    padding: 30px 0;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

    <header>
        <h1>CATATAN KAMI</h1>
        <p>Kelompok 2</p>
    </header>

    <form id="noteForm">
        <input
            type="text"
            id="title"
            placeholder="judul"
        >

        <textarea
            id="content"
            placeholder="isi"
        ></textarea>

        <button type="submit">simpan</button>
    </form>

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="carik catatan"
        >
    </div>

    <div id="list"></div>

</div>

<script>
const STORAGE_KEY = "catatanaja";

const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");
const searchInput = document.getElementById("search");
const noteList = document.getElementById("list");
const noteForm = document.getElementById("noteForm");

function loadNotes() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const data = saved ? JSON.parse(saved) : [];

        return Array.isArray(data) ? data : [];
    } catch (error) {
        console.error("gak bisa baca catatan:", error);
        return [];
    }
}

let notes = loadNotes();

function saveNotes(data) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
    } catch (error) {
        console.error("Gagal menyimpan catatan:", error);
        alert("gak bisa di simpen, gagal");
        return false;
    }
}

function formatDate(note) {
    if (!note.createdAt) {
        return note.date || "gadak waktu";
    }

    const date = new Date(note.createdAt);

    if (Number.isNaN(date.getTime())) {
        return "gadak waktu";
    }

    return new Intl.DateTimeFormat("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    }).format(date);
}

noteForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (!title && !content) {
        alert("isi judul or catatan duloooooooooo");
        return;
    }

    const newNote = {
        id: Date.now() + "-" + Math.random().toString(16).slice(2),
        title: title || "gadak judulnya",
        content: content,
        createdAt: new Date().toISOString()
    };

    const updatedNotes = [newNote, ...notes];

    if (saveNotes(updatedNotes)) {
        notes = updatedNotes;
        noteForm.reset();
        render();
    }
});

function deleteNote(id) {
    const updatedNotes = notes.filter(note => String(note.id) !== String(id));

    if (saveNotes(updatedNotes)) {
        notes = updatedNotes;
        render();
    }
}

function render() {
    const query = searchInput.value.trim().toLowerCase();

    const filteredNotes = notes.filter(note => {
        const title = note.title || "";
        const content = note.content || "";

        return (title + " " + content).toLowerCase().includes(query);
    });

    noteList.replaceChildren();

    if (filteredNotes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = query
            ? "gak nemu"
            : "belom ada catatan";

        noteList.appendChild(empty);
        return;
    }

    filteredNotes.forEach(note => {
        const article = document.createElement("article");
        article.className = "note";

        const heading = document.createElement("h3");
        heading.textContent = note.title || "gadak jyudul";

        const paragraph = document.createElement("p");
        paragraph.textContent = note.content || "";

        const date = document.createElement("small");
        date.textContent = "dibuat: " + formatDate(note);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "haposssssss";

        deleteButton.addEventListener("click", () => {
            deleteNote(note.id);
        });

        article.append(
            heading,
            paragraph,
            date,
            deleteButton
        );

        noteList.appendChild(article);
    });
}

searchInput.addEventListener("input", render);

render();
</script>

</body>
</html>
